name: Nightly

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high
      - name: List outdated packages
        run: pnpm outdated || true

  broken-links:
    name: Broken link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check repository links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --verbose README.md CONTRIBUTING.md CHANGELOG.md ARCHITECTURE.md DEPLOYMENT.md ROADMAP.md SECURITY.md .github
          fail: false

  lighthouse:
    name: Lighthouse audit
    runs-on: ubuntu-latest
    steps:
      - name: Audit production site
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: https://screen-recorder.pages.dev
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
